<style>
  :root {
    --bg: #131315;
    --text: #FFFFFF;
    --muted: #BDBDBD;
    --line: #292929;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-behavior: smooth; scroll-padding-top: 96px; background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-wrap: break-word;
    word-break: normal;
  }
  a { color: inherit; }
  a:focus-visible { outline: 1px solid var(--text); outline-offset: 4px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* Entrance */
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  header { animation: fade 1.2s ease both; }
  .hero-logo { animation: fade 1.6s .2s ease both; }
  .hero-tag { animation: rise 1s .4s cubic-bezier(.2,.7,.2,1) both; }
  h1 { animation: rise 1.1s .55s cubic-bezier(.2,.7,.2,1) both; }
  .hero-lead { animation: rise 1s .75s cubic-bezier(.2,.7,.2,1) both; }
  .sketch path { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 2.6s .9s ease forwards; }

  /* Scroll reveal */
  .js .reveal { opacity: 0; transform: translateY(16px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
  .js .reveal.in { opacity: 1; transform: none; }

  /* Header */
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding-top: 18px; padding-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 1.2rem; letter-spacing: .01em; }
  .brand img { width: 40px; height: 40px; object-fit: contain; display: block; }
  nav { display: flex; gap: 28px; font-size: .92rem; }
  nav a { text-decoration: none; color: var(--muted); position: relative; transition: color .3s; }
  nav a::after { content: ""; position: absolute; left: 0; bottom: -4px; height: 1px; width: 0; background: var(--text); transition: width .4s ease; }
  nav a:hover { color: var(--text); }
  nav a:hover::after { width: 100%; }

  /* Hero */
  .hero { padding: 120px 28px 104px; text-align: left; }
  .hero-logo { width: 200px; height: 200px; object-fit: contain; margin: 0 0 40px -20px; display: block; }
  .hero-tag { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); margin: 0 0 28px; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 300;
    font-size: clamp(2.8rem, 8vw, 6rem);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0 0 40px;
  }
  h1 span { font-weight: 500; overflow-wrap: anywhere; }
  .hero-lead { font-size: 1.15rem; color: var(--muted); max-width: 48ch; margin: 0; overflow-wrap: break-word; }

  /* Hand-drawn divider */
  .sketch { display: block; width: 100%; height: 90px; margin: 0; }
  .sketch path { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-linecap: round; }

  /* Sections */
  section { padding: 104px 0; }
  .row { display: grid; grid-template-columns: 200px 1fr; gap: 64px; align-items: start; }
  .label { font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
  .body p { margin: 0 0 22px; font-size: 1.12rem; color: var(--muted); }
  .body p:last-child { margin-bottom: 0; }
  .body p strong { color: var(--text); font-weight: 500; }
  .quote {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 300; font-style: italic;
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    line-height: 1.2; letter-spacing: -.01em;
    color: var(--text); margin: 0 0 36px;
  }

  /* Principles as hairline list */
  .principles { list-style: none; padding: 0; margin: 40px 0 0; border-top: 1px solid var(--line); }
  .principles li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; padding: 20px 0; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  .principles li span { min-width: 0; overflow-wrap: anywhere; }
  .principles li span:first-child { color: var(--text); }
  .principles li span:last-child { color: var(--muted); text-align: right; flex: 1 1 220px; }

  /* Contact */
  .links { display: flex; flex-wrap: wrap; gap: 12px; }
  .links a {
    text-decoration: none; padding: 14px 26px; border: 1px solid var(--line); color: var(--text);
    font-size: .95rem; letter-spacing: .02em; transition: background .4s ease, color .4s ease, border-color .4s ease;
  }
  .links a:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

  footer { border-top: 1px solid var(--line); padding: 40px 0 56px; color: var(--muted); font-size: .88rem; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  @media (max-width: 800px) {
    .row { grid-template-columns: 1fr; gap: 24px; }
    .hero { padding: 72px 22px 64px; }
    .hero-logo { width: 180px; height: 180px; margin: 0 auto 36px; }
    .hero-tag { letter-spacing: .16em; font-size: .7rem; line-height: 1.7; }
    h1 { font-size: clamp(2.2rem, 11vw, 2.8rem); line-height: 1.08; overflow-wrap: anywhere; }
    .hero-lead { font-size: 1.02rem; }
    section { padding: 80px 0; }
    nav { gap: 16px; }
    .sketch { height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    header, .hero-logo, .hero-tag, h1, .hero-lead, .sketch path, .js .reveal, nav a::after {
      animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important;
    }
    .sketch path { stroke-dashoffset: 0; }
  }
</style>
</head>
